<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<defs>

	<!-- ══════════════════════════════════════════════════════════════════
	     Gradients + filters shared by every symbol below.
	     Ids are namespaced nt-mh-* so they cannot collide with other sprites.
	     ══════════════════════════════════════════════════════════════════ -->

	<linearGradient id="nt-mh-metal" x1="0" y1="0" x2="0" y2="1">
		<stop offset="0%"   stop-color="#e9e2d4"/>
		<stop offset="38%"  stop-color="#a89c88"/>
		<stop offset="55%"  stop-color="#6d6152"/>
		<stop offset="100%" stop-color="#3a332a"/>
	</linearGradient>

	<linearGradient id="nt-mh-brass" x1="0" y1="0" x2="1" y2="1">
		<stop offset="0%"   stop-color="#f8dc8b"/>
		<stop offset="35%"  stop-color="#f5b944"/>
		<stop offset="68%"  stop-color="#d68a18"/>
		<stop offset="100%" stop-color="#8d4b0d"/>
	</linearGradient>

	<linearGradient id="nt-mh-timber" x1="0" y1="0" x2="1" y2="0">
		<stop offset="0%"   stop-color="#8a5631"/>
		<stop offset="45%"  stop-color="#5b3420"/>
		<stop offset="100%" stop-color="#3d2115"/>
	</linearGradient>

	<radialGradient id="nt-mh-medal-face" cx="38%" cy="30%" r="78%">
		<stop offset="0%"   stop-color="#fff3cd"/>
		<stop offset="30%"  stop-color="#f8dc8b"/>
		<stop offset="62%"  stop-color="#e0a52c"/>
		<stop offset="88%"  stop-color="#a9640f"/>
		<stop offset="100%" stop-color="#7a4409"/>
	</radialGradient>

	<radialGradient id="nt-mh-medal-glow" cx="50%" cy="50%" r="50%">
		<stop offset="0%"   stop-color="#ffd86b" stop-opacity="0.55"/>
		<stop offset="60%"  stop-color="#e09a1e" stop-opacity="0.18"/>
		<stop offset="100%" stop-color="#e09a1e" stop-opacity="0"/>
	</radialGradient>

	<filter id="nt-mh-emboss" x="-25%" y="-25%" width="150%" height="150%">
		<feDropShadow dx="0"  dy="2" stdDeviation="1.4" flood-color="#1b0f07" flood-opacity="0.7"/>
		<feDropShadow dx="0" dy="-1" stdDeviation="0.6" flood-color="#ffe9b0" flood-opacity="0.35"/>
	</filter>

	<filter id="nt-mh-cast" x="-40%" y="-40%" width="180%" height="180%">
		<feDropShadow dx="3" dy="7" stdDeviation="5" flood-color="#180d05" flood-opacity="0.5"/>
	</filter>

	<!-- Erodes the headline's outlines so the letters read as CUT INTO timber
	     rather than cast in polished metal. A small displacement only: enough
	     to break the vector-perfect edge and let the grain read through it,
	     not enough to hurt legibility at small sizes. -->
	<filter id="nt-mh-rough-type" x="-12%" y="-16%" width="124%" height="132%">
		<feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="4" seed="8" result="n"/>
		<feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"
		                   xChannelSelector="R" yChannelSelector="G"/>
	</filter>


	<!-- ══════════════════════════════════════════════════════════════════
	     MEDALLION - engraved gold badge for the crown of the board.
	     ══════════════════════════════════════════════════════════════════ -->
	<symbol id="nt-mh-medallion" viewBox="0 0 120 120">
		<circle cx="60" cy="60" r="58" fill="url(#nt-mh-medal-glow)"/>
		<circle cx="60" cy="60" r="44" fill="url(#nt-mh-brass)" filter="url(#nt-mh-cast)"/>
		<circle cx="60" cy="60" r="44" fill="none" stroke="#5d3206" stroke-width="1.6" opacity="0.85"/>
		<circle cx="60" cy="60" r="38" fill="none" stroke="#fff0c2" stroke-width="1" opacity="0.5"/>
		<circle cx="60" cy="60" r="33" fill="url(#nt-mh-medal-face)"/>
		<circle cx="60" cy="60" r="33" fill="none" stroke="#7a4409" stroke-width="1.2" opacity="0.6"/>
		<!-- knurled rim -->
		<g stroke="#7a4409" stroke-width="1.4" opacity="0.55">
			<path d="M60 17 v6M60 97 v6M17 60 h6M97 60 h6"/>
			<path d="M30 30 l4 4M86 86 l4 4M90 30 l-4 4M34 86 l-4 4"/>
		</g>
		<!-- engraved mark: a generic sunburst, no brand meaning -->
		<g fill="#7a4409" opacity="0.72" filter="url(#nt-mh-emboss)">
			<circle cx="60" cy="60" r="7"/>
			<path d="M60 34 l3.2 12 -6.4 0z"/>
			<path d="M60 86 l3.2 -12 -6.4 0z"/>
			<path d="M34 60 l12 3.2 0 -6.4z"/>
			<path d="M86 60 l-12 3.2 0 -6.4z"/>
			<path d="M42 42 l10 6 -4 4z"/>
			<path d="M78 78 l-10 -6 4 -4z"/>
			<path d="M78 42 l-6 10 -4 -4z"/>
			<path d="M42 78 l6 -10 4 4z"/>
		</g>
		<!-- specular sweep -->
		<ellipse cx="46" cy="40" rx="17" ry="10" fill="#fffaf0" opacity="0.3" transform="rotate(-28 46 40)"/>
	</symbol>


	<!-- ══════════════════════════════════════════════════════════════════
	     SIDE ORNAMENTS. Each is a self-contained pair-able motif; the
	     component mirrors it for the right-hand side with a CSS transform,
	     so one symbol serves both sides.

	     Which one appears is chosen from JSON (`ornament`), so a different
	     business can pick a different motif without touching markup.
	     ══════════════════════════════════════════════════════════════════ -->

	<!-- crossed: two crossed long-arms over a plate. -->
	<symbol id="nt-mh-orn-crossed" viewBox="0 0 200 200">
		<g filter="url(#nt-mh-cast)">
			<g transform="rotate(-34 100 100)">
				<rect x="26" y="92" width="142" height="9" rx="3" fill="url(#nt-mh-timber)"/>
				<rect x="150" y="86" width="34" height="21" rx="5" fill="url(#nt-mh-metal)"/>
				<rect x="96" y="88" width="48" height="14" rx="3" fill="url(#nt-mh-metal)"/>
				<path d="M26 96 q-14 6 -16 18 q14 -2 18 -10z" fill="url(#nt-mh-timber)"/>
			</g>
			<g transform="rotate(34 100 100)">
				<rect x="26" y="92" width="142" height="9" rx="3" fill="url(#nt-mh-timber)"/>
				<rect x="150" y="86" width="34" height="21" rx="5" fill="url(#nt-mh-metal)"/>
				<rect x="96" y="88" width="48" height="14" rx="3" fill="url(#nt-mh-metal)"/>
				<path d="M26 96 q-14 6 -16 18 q14 -2 18 -10z" fill="url(#nt-mh-timber)"/>
			</g>
			<circle cx="100" cy="100" r="15" fill="url(#nt-mh-brass)" stroke="#5d3206" stroke-width="1.4"/>
			<circle cx="100" cy="100" r="6"  fill="#7a4409" opacity="0.7"/>
		</g>
	</symbol>

	<!-- rope: a coiled rope with a hanging loop and knot. -->
	<symbol id="nt-mh-orn-rope" viewBox="0 0 200 200">
		<g fill="none" stroke="url(#nt-mh-brass)" stroke-linecap="round" filter="url(#nt-mh-cast)">
			<path d="M150 12 q-46 34 -52 78 q-6 46 34 76" stroke-width="11" opacity="0.95"/>
			<path d="M150 12 q-46 34 -52 78 q-6 46 34 76" stroke-width="4" stroke="#7a4409" opacity="0.45" stroke-dasharray="7 9"/>
			<ellipse cx="86" cy="150" rx="34" ry="24" stroke-width="10"/>
			<ellipse cx="86" cy="150" rx="34" ry="24" stroke-width="3.5" stroke="#7a4409" opacity="0.45" stroke-dasharray="7 9"/>
		</g>
		<rect x="72" y="112" width="30" height="20" rx="6" fill="url(#nt-mh-metal)" stroke="#33291f" stroke-width="1.2"/>
	</symbol>

	<!-- chain: hanging links ending in a shackle. -->
	<symbol id="nt-mh-orn-chain" viewBox="0 0 200 200">
		<g fill="none" stroke="url(#nt-mh-metal)" stroke-width="9" filter="url(#nt-mh-cast)">
			<ellipse cx="118" cy="26"  rx="15" ry="22"/>
			<ellipse cx="106" cy="66"  rx="15" ry="22"/>
			<ellipse cx="96"  cy="106" rx="15" ry="22"/>
			<ellipse cx="88"  cy="146" rx="15" ry="22"/>
		</g>
		<g fill="none" stroke="#efe7d8" stroke-width="1.6" opacity="0.4">
			<ellipse cx="118" cy="26" rx="15" ry="22"/>
			<ellipse cx="96" cy="106" rx="15" ry="22"/>
		</g>
		<circle cx="86" cy="178" r="14" fill="none" stroke="url(#nt-mh-brass)" stroke-width="8"/>
	</symbol>

	<!-- botanical: a generic stalk-and-leaf spray, for produce trades. -->
	<symbol id="nt-mh-orn-botanical" viewBox="0 0 200 200">
		<g filter="url(#nt-mh-cast)">
			<path d="M112 190 q-6 -70 14 -132" stroke="url(#nt-mh-timber)" stroke-width="10" fill="none" stroke-linecap="round"/>
			<path d="M104 190 q-16 -66 -6 -122" stroke="url(#nt-mh-timber)" stroke-width="8"  fill="none" stroke-linecap="round"/>
			<g fill="url(#nt-mh-brass)" opacity="0.92">
				<path d="M124 62 q34 -14 44 -44 q-38 2 -50 34z"/>
				<path d="M118 96 q36 -8 50 -34 q-38 -4 -54 26z"/>
				<path d="M98 74  q-32 -18 -40 -48 q36 4 46 36z"/>
				<path d="M96 112 q-34 -12 -46 -38 q38 0 50 30z"/>
			</g>
			<g fill="#7a4409" opacity="0.35">
				<path d="M124 62 q34 -14 44 -44"/>
			</g>
			<rect x="92" y="150" width="34" height="13" rx="4" fill="url(#nt-mh-metal)"/>
		</g>
	</symbol>

</defs>
</svg>
