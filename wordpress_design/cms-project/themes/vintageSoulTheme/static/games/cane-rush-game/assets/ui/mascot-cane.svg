<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -25 220 260">
  <defs>
    <linearGradient id="mascotBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#B6F27A"/>
      <stop offset="55%" stop-color="#8BD246"/>
      <stop offset="100%" stop-color="#5FA82C"/>
    </linearGradient>
    <linearGradient id="mascotLeaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8BD246"/>
      <stop offset="100%" stop-color="#5FA82C"/>
    </linearGradient>
    <linearGradient id="mascotScarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA25E"/>
      <stop offset="100%" stop-color="#E8641C"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="212" rx="50" ry="9" fill="#2E2A1F" opacity="0.16"/>

  <!-- backpack sliver (peeks out behind the body, left side) -->
  <g transform="rotate(-5 40 120)">
    <rect x="24" y="94" width="30" height="58" rx="10" fill="#5FA82C" stroke="#2E2A1F" stroke-opacity="0.25" stroke-width="3"/>
    <rect x="30" y="105" width="18" height="4" rx="2" fill="#3F7A1D"/>
    <rect x="30" y="118" width="18" height="4" rx="2" fill="#3F7A1D"/>
    <rect x="30" y="131" width="18" height="4" rx="2" fill="#3F7A1D"/>
  </g>

  <!-- arms (shoulders tuck behind the body, hands stay clear of it) -->
  <line x1="54" y1="118" x2="22" y2="152" stroke="#5FA82C" stroke-width="26" stroke-linecap="round"/>
  <circle cx="20" cy="156" r="15" fill="#5FA82C" stroke="#2E2A1F" stroke-opacity="0.22" stroke-width="2.5"/>
  <line x1="146" y1="118" x2="178" y2="152" stroke="#5FA82C" stroke-width="26" stroke-linecap="round"/>
  <circle cx="180" cy="156" r="15" fill="#5FA82C" stroke="#2E2A1F" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- legs / shoes (tops tuck behind the body, feet peek out below) -->
  <g stroke="#2E2A1F" stroke-opacity="0.22" stroke-width="2.5">
    <ellipse cx="74" cy="202" rx="24" ry="16" fill="#8B5A2B"/>
    <ellipse cx="126" cy="202" rx="24" ry="16" fill="#8B5A2B"/>
  </g>
  <rect x="55" y="196" width="38" height="7" rx="3.5" fill="#EADFC4"/>
  <rect x="107" y="196" width="38" height="7" rx="3.5" fill="#EADFC4"/>

  <!-- body -->
  <rect x="40" y="50" width="120" height="145" rx="58" fill="url(#mascotBody)" stroke="#2E2A1F" stroke-width="4.5"/>
  <ellipse cx="72" cy="90" rx="17" ry="36" fill="#FFFFFF" opacity="0.22" transform="rotate(-6 72 90)"/>

  <!-- scarf -->
  <path d="M50,92 Q100,110 150,92 L150,108 Q100,124 50,108 Z" fill="url(#mascotScarf)" stroke="#2E2A1F" stroke-width="3" stroke-linejoin="round"/>
  <path d="M56,100 Q34,112 28,136 Q42,126 60,112 Z" fill="url(#mascotScarf)" stroke="#2E2A1F" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- face -->
  <ellipse cx="80" cy="80" rx="16" ry="18" fill="#FFFFFF"/>
  <ellipse cx="120" cy="80" rx="16" ry="18" fill="#FFFFFF"/>
  <circle cx="84" cy="85" r="8.5" fill="#2E2A1F"/>
  <circle cx="124" cy="85" r="8.5" fill="#2E2A1F"/>
  <circle cx="81" cy="80" r="3.2" fill="#FFFFFF"/>
  <circle cx="121" cy="80" r="3.2" fill="#FFFFFF"/>
  <ellipse cx="58" cy="98" rx="9" ry="6" fill="#FF6FA5" opacity="0.4"/>
  <ellipse cx="142" cy="98" rx="9" ry="6" fill="#FF6FA5" opacity="0.4"/>
  <path d="M84,108 Q100,120 116,108" fill="none" stroke="#2E2A1F" stroke-width="4.5" stroke-linecap="round"/>

  <!-- leaf spray on top -->
  <path d="M100,54 C97,28 97,10 100,-10 C103,10 103,28 100,54 Z" fill="url(#mascotLeaf)" stroke="#2E2A1F" stroke-width="3.5" stroke-linejoin="round"/>
  <g transform="rotate(-30 100 54)">
    <path d="M100,54 C90,34 88,16 96,0 C103,16 104,34 100,54 Z" fill="#5FA82C" stroke="#2E2A1F" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="rotate(28 100 54)">
    <path d="M100,54 C90,34 88,16 96,0 C103,16 104,34 100,54 Z" fill="#5FA82C" stroke="#2E2A1F" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
