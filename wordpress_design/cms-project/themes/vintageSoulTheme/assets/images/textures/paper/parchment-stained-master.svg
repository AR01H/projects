<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200" width="100%" height="100%">
  <defs>
    <!-- Paper base texture filter -->
    <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" seed="8" result="noise"/>
      <feColorMatrix type="matrix" values="0.33 0 0 0 0.55  0 0.33 0 0 0.42  0 0 0.33 0 0.28  0 0 0 0.18 0" result="colorNoise"/>
      <feBlend in="SourceGraphic" in2="colorNoise" mode="multiply"/>
    </filter>

    <!-- Water/Tea Stain Blotches filter with displacement -->
    <filter id="tea-displace" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="4" seed="42" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="35" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Stain gradient 1: Large tea stain on left -->
    <radialGradient id="tea-stain-left" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#b67a3a" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#be8242" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#c99558" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d4aa73" stop-opacity="0"/>
    </radialGradient>

    <!-- Stain gradient 2: Bottom-left darker folded wash -->
    <radialGradient id="tea-stain-bottom" cx="20%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#aa6d2e" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ba7f40" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4aa73" stop-opacity="0"/>
    </radialGradient>

    <!-- Droplet splatter gradient -->
    <radialGradient id="tea-drop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a5e20" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#b27638" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c58e50" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Multi-layered warm parchment washes -->
  <rect width="100%" height="100%" fill="url(#tea-stain-left)" filter="url(#tea-displace)"/>
  <rect width="100%" height="100%" fill="url(#tea-stain-bottom)" filter="url(#tea-displace)"/>

  <!-- Organic Tea/Coffee blotch (exact spot like in user image on upper-left) -->
  <ellipse cx="60" cy="380" rx="90" ry="75" fill="url(#tea-stain-left)" filter="url(#tea-displace)"/>
  
  <!-- Water drops / splatters -->
  <circle cx="120" cy="460" r="14" fill="url(#tea-drop)"/>
  <circle cx="150" cy="485" r="9" fill="url(#tea-drop)"/>
  <circle cx="50" cy="540" r="12" fill="url(#tea-drop)"/>
  <circle cx="360" cy="1160" r="15" fill="url(#tea-drop)"/>

  <!-- Crease/Fold Watermark Line diagonally across bottom -->
  <path d="M-20,950 Q200,980 400,1050 T620,1180" fill="none" stroke="#ba7f40" stroke-width="2.5" opacity="0.35" filter="url(#tea-displace)"/>
  <path d="M-20,952 Q200,982 400,1052 T620,1182" fill="none" stroke="#fff5df" stroke-width="1.5" opacity="0.45"/>

  <!-- Second subtle horizontal fold -->
  <path d="M-20,320 Q300,310 620,330" fill="none" stroke="#b27638" stroke-width="1.8" opacity="0.25" filter="url(#tea-displace)"/>
  <path d="M-20,322 Q300,312 620,332" fill="none" stroke="#fff5df" stroke-width="1.2" opacity="0.35"/>

  <!-- Vignette dark edges -->
  <rect width="100%" height="100%" fill="none" stroke="#9a5e20" stroke-width="40" opacity="0.08"/>
</svg>
