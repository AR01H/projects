<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Light Aged Parchment Gradient -->
    <linearGradient id="card-parch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf5e8"/>
      <stop offset="50%" stop-color="#f5dfc2"/>
      <stop offset="100%" stop-color="#ebd0a8"/>
    </linearGradient>

    <!-- Fiber noise filter -->
    <filter id="card-fiber" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="14" result="noise"/>
      <feColorMatrix type="matrix" values="0.15 0 0 0 0.15  0 0.15 0 0 0.12  0 0 0.15 0 0.08  0 0 0 0.25 0" result="colorNoise"/>
      <feBlend in="SourceGraphic" in2="colorNoise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Single Clean, Crisp Rough Cut Gold Border Path -->
  <path d="M16,6 
           L36,7 L58,5 L82,7 L110,5 L138,7 L164,5 L184,8
           C192,9 196,14 195,22
           L196,44 L194,72 L196,102 L194,136 L196,166 L195,182
           C194,190 188,195 180,194
           L160,196 L134,194 L106,196 L76,194 L48,196 L24,194
           C16,194 7,188 6,180
           L4,162 L6,132 L4,98 L6,66 L4,34 L5,20
           C6,11 10,7 16,6 Z" 
        fill="url(#card-parch-bg)" 
        stroke="#8e622d" 
        stroke-width="1.8"
        filter="url(#card-fiber)"/>
</svg>
