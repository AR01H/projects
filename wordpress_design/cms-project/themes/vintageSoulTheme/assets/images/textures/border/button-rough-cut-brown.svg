<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <defs>
    <!-- Paper texture & grain filter -->
    <filter id="btn-fiber-brown" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="73" result="noise"/>
      <feColorMatrix type="matrix" values="0.15 0 0 0 0.18  0 0.12 0 0 0.09  0 0 0.08 0 0.04  0 0 0 0.4 0" result="colorNoise"/>
      <feBlend in="SourceGraphic" in2="colorNoise" mode="multiply"/>
    </filter>

    <!-- Rich Roasted Mahogany / Sepia Gradient -->
    <linearGradient id="bg-mahogany" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e270e"/>
      <stop offset="40%" stop-color="#381a07"/>
      <stop offset="100%" stop-color="#200d03"/>
    </linearGradient>
  </defs>

  <!-- Single Clean Jagged Torn Cut Path (Brown Button) -->
  <path d="M12,4 
           L24,5 L38,3 L52,5 L68,3 L84,5 L98,3 L108,5
           C114,6 117,9 116,15
           L117,25 L115,35 L117,45
           C116,51 113,55 107,56
           L95,54 L80,56 L64,54 L48,56 L32,54 L18,56
           C12,56 5,52 5,46
           L3,36 L5,26 L4,16
           C4,10 7,5 12,4 Z" 
        fill="url(#bg-mahogany)" 
        stroke="#caa06d" 
        stroke-width="1.8"
        filter="url(#btn-fiber-brown)"/>
</svg>
