<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <defs>
    <!-- Paper texture & noise filter -->
    <filter id="btn-fiber-out" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="99" result="noise"/>
      <feColorMatrix type="matrix" values="0.1 0 0 0 0.2  0 0.1 0 0 0.15  0 0 0.1 0 0.08  0 0 0 0.25 0" result="colorNoise"/>
      <feBlend in="SourceGraphic" in2="colorNoise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Outer Jagged Torn Cut Path (Outline) -->
  <path d="M12,4 
           L24,5 L38,3 L52,5 L68,3 L84,5 L98,3 L108,5
           C114,6 117,9 116,15
           L117,25 L115,35 L117,45
           C116,51 113,55 107,56
           L95,54 L80,56 L64,54 L48,56 L32,54 L18,56
           C12,56 5,52 5,46
           L3,36 L5,26 L4,16
           C4,10 7,5 12,4 Z" 
        fill="rgba(247, 235, 217, 0.6)" 
        stroke="#8e622d" 
        stroke-width="1.8"
        filter="url(#btn-fiber-out)"/>

  <!-- Inner Double Gold Deckled Line -->
  <path d="M14,8 
           L26,9 L40,7 L54,9 L70,7 L86,9 L98,7 L105,9
           C109,10 112,12 112,17
           L113,26 L111,35 L113,43
           C112,47 109,50 105,51
           L93,49 L78,51 L62,49 L46,51 L30,49 L16,51
           C12,51 8,48 8,43
           L7,35 L9,26 L8,17
           C8,12 11,9 14,8 Z" 
        fill="none" 
        stroke="#caa06d" 
        stroke-width="1.2" 
        opacity="0.8"/>
</svg>
