<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <!-- Paper texture & fiber filter -->
    <filter id="photo-fiber" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="85" result="noise"/>
      <feColorMatrix type="matrix" values="0.12 0 0 0 0.18  0 0.12 0 0 0.14  0 0 0.12 0 0.08  0 0 0 0.35 0" result="colorNoise"/>
      <feBlend in="SourceGraphic" in2="colorNoise" mode="multiply"/>
    </filter>

    <!-- Warm Aged Parchment Gradient -->
    <linearGradient id="photo-parch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="50%" stop-color="#f5e1c6"/>
      <stop offset="100%" stop-color="#ebd2ad"/>
    </linearGradient>
  </defs>

  <!-- Single Clean Deep Rough Cut Torn Frame -->
  <path d="M14,6 
           L26,8 L38,5 L52,8 L68,4 L86,8 L104,5 L122,8 L138,4 L148,8
           C154,10 157,15 155,22
           L158,38 L154,54 L158,72 L153,92 L157,114 L153,136 L158,158 L154,178 L157,188
           C155,194 148,197 140,195
           L124,198 L106,194 L88,198 L70,194 L52,198 L36,194 L22,197 L12,194
           C5,192 3,186 4,178
           L2,160 L6,142 L2,120 L6,98 L2,76 L6,54 L2,34 L5,20
           C5,12 8,7 14,6 Z" 
        fill="url(#photo-parch-bg)" 
        stroke="#8e622d" 
        stroke-width="1.8"
        filter="url(#photo-fiber)"/>
</svg>
