<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" preserveAspectRatio="none">
  <defs>
    <!-- Paper fiber texture -->
    <filter id="torn-edge-fiber" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.04" numOctaves="3" seed="91" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Real Organic Torn Paper Curve (Dark Botanical Fill) -->
  <path d="M0,18
           Q60,12 120,16 Q180,21 240,14 Q300,9 360,15 Q420,20 480,13 Q540,8 600,16 Q660,22 720,14 Q780,9 840,16 Q900,21 960,13 Q1020,8 1080,15 Q1140,21 1200,16
           L1200,28 L0,28 Z"
        fill="#102d18"
        filter="url(#torn-edge-fiber)"/>

  <!-- Delicate Antique Gold Deckle Trim Line -->
  <path d="M0,17
           Q60,11 120,15 Q180,20 240,13 Q300,8 360,14 Q420,19 480,12 Q540,7 600,15 Q660,21 720,13 Q780,8 840,15 Q900,20 960,12 Q1020,7 1080,14 Q1140,20 1200,15"
        fill="none"
        stroke="#caa06d"
        stroke-width="1.2"
        opacity="0.8"
        filter="url(#torn-edge-fiber)"/>
</svg>
