<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" preserveAspectRatio="none">
  <defs>
    <!-- Organic Hand-Torn Deckle Paper Roughness Filter -->
    <filter id="authenticRoughnessFade" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.03" numOctaves="3" seed="35" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="1" result="finalRoughEdge"/>
    </filter>

    <!-- Smooth Multi-Stop Gradient Fade -->
    <linearGradient id="deckleGradientFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="10%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="24%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Hand-Drawn Silhouette with Authentic Deckle Roughness AND Smooth Gradient Fade -->
  <path d="M 220,-10 
           C 212,40 210,70 210,95 
           C 210,105 225,105 235,110 
           C 242,125 244,145 244,170 
           C 244,210 250,250 248,290 
           C 246,330 236,360 228,375 
           L 182,380 
           C 175,410 162,445 158,475 
           C 156,495 162,510 148,530 
           C 135,550 118,575 106,595 
           L 96,595 
           C 85,625 68,660 55,690 
           L 46,690 
           C 35,725 18,765 0,810 
           L 1000,810 
           L 1000,-10 
           Z" 
        fill="url(#deckleGradientFade)" 
        filter="url(#authenticRoughnessFade)"/>

  <!-- Solid White Backing for Full Opacity across Main Artwork Stage -->
  <rect x="480" y="0" width="520" height="800" fill="#ffffff"/>
</svg>
