<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" preserveAspectRatio="none">
  <defs>
    <filter id="tornLineTurb" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.045" numOctaves="4" seed="42" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="50" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
    </filter>
  </defs>
  <!-- Subtle organic torn cut boundary fiber & shadow line on the left -->
  <path d="M 200,-10 Q 185,120 220,260 T 195,480 Q 225,620 200,810" fill="none" stroke="rgba(42, 26, 12, 0.25)" stroke-width="3" filter="url(#tornLineTurb)"/>
  <path d="M 200,-10 Q 185,120 220,260 T 195,480 Q 225,620 200,810" fill="none" stroke="rgba(255, 245, 225, 0.4)" stroke-width="1.5" filter="url(#tornLineTurb)"/>
</svg>
