<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="coinFace" cx="36%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFF9DA"/>
      <stop offset="35%" stop-color="#FFE38A"/>
      <stop offset="70%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#E8AC1A"/>
    </radialGradient>
    <linearGradient id="coinRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#B8791A"/>
    </linearGradient>
  </defs>

  <!-- drop shadow -->
  <ellipse cx="50" cy="86" rx="26" ry="6" fill="#2E2A1F" opacity="0.18"/>

  <!-- coin edge/thickness band, milled ridge ticks -->
  <circle cx="50" cy="54" r="37" fill="url(#coinRim)" stroke="#8C5C10" stroke-width="2"/>
  <g stroke="#8C5C10" stroke-width="2" opacity="0.55">
    <path d="M50,17 v6 M79.4,26.6 l-4.2,4.4 M87.9,50 h-6 M79.4,73.4 l-4.2,-4.4 M50,83 v6 M20.6,73.4 l4.2,-4.4 M12.1,50 h6 M20.6,26.6 l4.2,4.4"/>
    <path d="M66,20.5 l-3,5.2 M92.1,63.5 l-5.2,3 M75.5,84.9 l-3,-5.2 M23.9,84.9 l3,-5.2 M7.9,63.5 l5.2,3 M33.9,20.5 l3,5.2"/>
  </g>

  <!-- raised face -->
  <circle cx="50" cy="48" r="34" fill="url(#coinFace)" stroke="#C4871A" stroke-width="3"/>
  <circle cx="50" cy="48" r="26" fill="none" stroke="#FFF3C2" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.75"/>

  <!-- top-left glossy highlight -->
  <path d="M20,40 A30,30 0 0 1 44,16" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <ellipse cx="34" cy="30" rx="9" ry="5" fill="#FFFFFF" opacity="0.35" transform="rotate(-28 34 30)"/>

  <!-- embossed cane-leaf mint mark -->
  <g transform="translate(50,50)">
    <path d="M-5,16 C-5,0 -5,-10 0,-20 C5,-10 5,0 5,16 Z" fill="#B8791A" opacity="0.9" transform="translate(1,1)"/>
    <path d="M-5,16 C-5,0 -5,-10 0,-20 C5,-10 5,0 5,16 Z" fill="#FFF7E9"/>
    <path d="M0,-20 C-8,-16 -10,-8 -8,0" fill="none" stroke="#FFF7E9" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  </g>
</svg>
