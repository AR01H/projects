<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -15 150 230">
  <defs>
    <linearGradient id="caneStalk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CFF599"/>
      <stop offset="45%" stop-color="#8BD246"/>
      <stop offset="100%" stop-color="#5FA82C"/>
    </linearGradient>
    <linearGradient id="caneLeafMain" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8BD246"/>
      <stop offset="100%" stop-color="#5FA82C"/>
    </linearGradient>
  </defs>

  <!-- back leaves -->
  <g transform="rotate(-32 60 76)">
    <path d="M60,78 C50,60 47,38 55,14 C62,34 63,60 60,78 Z" fill="#5FA82C" stroke="#2E2A1F" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="rotate(30 60 76)">
    <path d="M60,78 C50,60 47,38 55,14 C62,34 63,60 60,78 Z" fill="#5FA82C" stroke="#2E2A1F" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- stalk -->
  <rect x="42" y="66" width="36" height="128" rx="18" fill="url(#caneStalk)" stroke="#2E2A1F" stroke-width="4"/>
  <path d="M43,98 Q60,104 77,98" fill="none" stroke="#3F7A1D" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M43,132 Q60,138 77,132" fill="none" stroke="#3F7A1D" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M43,166 Q60,172 77,166" fill="none" stroke="#3F7A1D" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <ellipse cx="52" cy="80" rx="7" ry="34" fill="#FFFFFF" opacity="0.22"/>

  <!-- cut top -->
  <ellipse cx="60" cy="66" rx="18" ry="8" fill="#EFE6CE" stroke="#2E2A1F" stroke-width="4"/>
  <ellipse cx="60" cy="65" rx="12" ry="5" fill="#F7F1DE"/>

  <!-- front/main leaf -->
  <g>
    <path d="M60,70 C46,48 44,20 56,-4 C68,20 70,48 60,70 Z" fill="url(#caneLeafMain)" stroke="#2E2A1F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M60,66 C58,44 58,20 58,2" fill="none" stroke="#3F7A1D" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
